name: Fix Tetris syntax

on:
  push:
    paths:
      - '.github/workflows/fix-tetris-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '},const wp={en:{title:"Information / Donations"'
          new = '},wp={en:{title:"Information / Donations"'
          if old not in s:
              raise SystemExit('Expected broken syntax marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Fixed Tetris syntax')
          PY
      - name: Verify
        run: |
          grep -q '},wp={en:{title:"Information / Donations"' index.html
          ! grep -q '},const wp={en:{title:"Information / Donations"' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Tetris blank page syntax error"
          git push

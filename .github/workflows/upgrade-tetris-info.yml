name: Upgrade Tetris Info

on:
  push:
    paths:
      - '.github/workflows/upgrade-tetris-info.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Info / Donations
        run: python .github/scripts/upgrade-tetris-info.py
      - name: Verify
        run: |
          grep -q 'Donate with PayPal' index.html
          grep -q 'Donate with Stripe' index.html
          grep -q 'Doniraj putem PayPala' index.html
          grep -q 'Kopirano!' index.html
          grep -q 'language:m.language' index.html
          grep -q 'copy-crypto-' index.html
          ! grep -q 'apps-games-info-standard.js' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Tetris Info design"
          git push

# retry after fixing component boundary

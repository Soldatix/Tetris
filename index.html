nije",name:"TETRIS!",points:"800 × Razina",highlight:!0}],additionalPoints:[{name:"Meko spuštanje (Soft Drop)",desc:"+1 dodatni bod za svaku pređenu ćeliju"},{name:"Brzo spuštanje (Hard Drop)",desc:"+2 dodatna boda za svaku preskočenu ćeliju"},{name:"Uzastopni Combo",desc:"+50 × Broj uzastopnih čišćenja × Razina"},{name:"Napredovanje po razinama",desc:"Svakih 10 očišćenih linija brzina se povećava"}],featuresTitle:"Opcije i mogućnosti igre",featuresList:[{title:"Sjena elementa (Ghost Piece)",description:"Prikazuje prozirnu projekciju mjesta gdje će oblik pasti radi lakšeg i preciznijeg postavljanja."},{title:"Spremi i izađi (Save & Exit)",description:"Spremite točno stanje ploče, rezultat i razinu u lokalnu memoriju preglednika i nastavite kad god poželite."},{title:"Rang lista igrača (Leaderboard)",description:"Nakon završetka igre upišite svoje ime i zabilježite rekord među najboljim rezultatima."},{title:"Puni zaslon i zvučni efekti",description:"Igrajte preko cijelog ekrana uz retro Web Audio zvučne efekte i 8-bitnu glazbu."}],tipsTitle:"Savjeti i pobjedničke strategije",tipsList:[{title:"Održavajte ravnu površinu",description:"Izbjegavajte stvaranje dubokih rupa i tornjeva. Ravnomjerno raspoređujte blokove kako ne biste blokirali prazne prostore."},{title:"Ostvarite TETRIS (4 linije odjednom)",description:"Ostavite krajnji desni ili lijevi stupac slobodnim za dugački I-element kako biste ostvarili maksimalan broj bodova."},{title:"Pametno koristite spremnik (Hold)",description:"Spremite dugački blok (I) ili kvadrat (O) za trenutke kada vam najviše trebaju ili kada vam trenutni oblik ne odgovara."},{title:"Pratite nadolazeće oblike (Next)",description:"Gledajte koje figure dolaze sljedeće kako biste unaprijed isplanirali raspored na ploči."}]},en:{guideTitle:"Rules & How to Play",guideSubtitle:"Comprehensive guide to controls, scoring, and strategies",introTitle:"Game Objective",introText:"Tetris is a legendary puzzle game where falling shapes (tetrominoes) must be manipulated and positioned to create solid horizontal lines of ten blocks without gaps. When a line is complete, it clears and you earn points! Every 10 cleared lines advances you to the next level, increasing the fall speed. The game ends when stacked blocks reach the top of the board.",controlsTitle:"Keyboard & Touch Controls",controlsSubtitle:"Complete list of keybindings and actions",keyboardTable:[{action:"Move Left / Right",keys:"Left / Right Arrow Keys or A / D",detail:"Moves the tetromino horizontally across the board"},{action:"Rotate Clockwise",keys:"Up Arrow, W, or X",detail:"Rotates the piece 90 degrees clockwise"},{action:"Rotate Counterclockwise",keys:"Z",detail:"Rotates the piece 90 degrees counterclockwise"},{action:"Soft Drop",keys:"Down Arrow or S",detail:"Accelerates piece descent (+1 point per cell)"},{action:"Hard Drop",keys:"Spacebar",detail:"Instantly locks piece to the bottom (+2 points per cell)"},{action:"Hold / Swap Piece",keys:"C or Shift",detail:"Stores the active piece for later use (once per piece)"},{action:"Pause / Menu",keys:"Escape or P",detail:"Pauses game and opens menu with save options"}],touchControlsNote:"On mobile phones and tablets, use the dedicated on-screen touch controls: D-pad navigation, hard drop, dual-direction rotations, hold piece, and pause.",scoringTitle:"Scoring System & Progression",scoringSubtitle:"Earn maximum points by clearing multiple lines simultaneously",scoringTable:[{label:"1 Line",name:"Single",points:"100 × Level"},{label:"2 Lines",name:"Double",points:"300 × Level"},{label:"3 Lines",name:"Triple",points:"500 × Level"},{label:"4 Lines",name:"TETRIS!",points:"800 × Level",highlight:!0}],additionalPoints:[{name:"Soft Drop",desc:"+1 bonus point for each fallen cell"},{name:"Hard Drop",desc:"+2 bonus points for each dropped cell"},{name:"Consecutive Combos",desc:"+50 × Combo count × Level for chaining clears"},{name:"Level Advancement",desc:"Level increases every 10 lines, speeding up drops"}],featuresTitle:"Game Features & Customization",featuresList:[{title:"Ghost / Shadow Piece",description:"Displays a landing projection guide showing exactly where the piece will land."},{title:"Save & Exit",description:"Save your exact board, score, and level to browser storage and resume anytime."},{title:"Leaderboard & High Scores",description:"Submit your name after the game to record your score in the top players list."},{title:"Fullscreen & Audio Synthesizer",description:"Immerse yourself in fullscreen mode with crisp retro sound effects and music."}],tipsTitle:"Pro Tips & Winning Strategies",tipsList:[{title:"Keep the Stack Flat",description:"Avoid creating high spires or jagged peaks. A smooth, even surface prevents holes."},{title:"Build for a TETRIS",description:"Keep the far-right column open, build four solid rows, and drop an I-bar for maximum points."},{title:"Master the Hold Feature",description:"Save straight I-bars or square O-blocks in the hold queue for tight spots or scoring setups."},{title:"Look Ahead at the Next Queue",description:"Anticipate upcoming tetrominoes in the preview box to plan your placements in advance."}]},de:{guideTitle:"Spielregeln & Anleitung",guideSubtitle:"Ausführlicher Leitfaden zu Steuerung, Punkten und Taktik",introTitle:"Spielziel",introText:"Tetris ist ein legendäres Puzzlespiel, bei dem herabfallende geometrische Blöcke (Tetrominoes) so gedreht und platziert werden müssen, dass sie lückenlose horizontale Reihen von 10 Blöcken bilden. Vollständige Reihen lösen sich auf und bringen Punkte! Nach jeweils 10 geräumten Reihen steigt das Level und die Fallgeschwindigkeit erhöht sich. Das Spiel endet, wenn die Blöcke den oberen Spielfeldrand erreichen.",controlsTitle:"Tastatur- & Touch-Steuerung",controlsSubtitle:"Übersicht über alle Tastenbelegungen und Aktionen",keyboardTable:[{action:"Links / Rechts bewegen",keys:"Pfeiltasten Links / Rechts oder A / D",detail:"Bewegt den Block horizontal über das Spielfeld"},{action:"Im Uhrzeigers     <style id="soldatix-mobile-layout-fix">
      @media (max-width: 767px) {
        html.tetris-game-active,
        html.tetris-game-active body,
        html.tetris-game-active #root {
          width: 100%; height: var(--tetris-visible-height, 100dvh);
          min-height: 0; overflow: hidden;
        }
        html.tetris-game-active #modern-tetris-app {
          height: 100%; min-height: 0; padding: 4px;
          justify-content: flex-start; overflow: hidden;
        }
        html.tetris-game-active #modern-tetris-app > div:not(.fixed) {
          height: 100%; min-height: 0;
        }
        html.tetris-game-active #app-header {
          flex: 0 0 auto; flex-wrap: nowrap; gap: 2px;
          margin-bottom: 4px; padding: 4px 5px; border-radius: 10px;
        }
        html.tetris-game-active #app-header > div:first-child { display: none; }
        html.tetris-game-active #app-header > div:last-child {
          width: 100%; flex-wrap: nowrap; justify-content: space-between;
          gap: 2px; overflow-x: auto; scrollbar-width: none;
        }
        html.tetris-game-active #app-header > div:last-child::-webkit-scrollbar { display: none; }
        html.tetris-game-active #app-header button { flex: 0 0 auto; padding: 6px; }
        html.tetris-game-active main {
          min-height: 0; justify-content: flex-start;
          padding-bottom: 0; overflow: hidden;
        }
        html.tetris-game-active .mobile-game-layout {
          width: 100%; flex: 1 1 auto; min-height: 0;
          gap: 4px !important; overflow: hidden;
        }
        html.tetris-game-active .mobile-summary-row {
          width: 100%; max-width: none; height: 74px; flex: 0 0 74px;
          align-items: stretch; gap: 4px; margin: 0; padding: 0 2px;
        }
        html.tetris-game-active #hold-piece-panel {
          width: 74px; min-width: 74px; height: 74px;
          padding: 4px; border-radius: 9px;
        }
        html.tetris-game-active #hold-piece-panel > div:first-child { margin-bottom: 0; }
        html.tetris-game-active #hold-piece-panel > div:first-child span:last-child,
        html.tetris-game-active #hold-piece-panel > span:last-child { display: none; }
        html.tetris-game-active #hold-piece-panel > div:nth-child(2),
        html.tetris-game-active #hold-piece-panel canvas { width: 48px; height: 48px; }
        html.tetris-game-active .mobile-summary-row > div:nth-child(2) {
          min-width: 0; height: 74px; padding: 5px 7px; border-radius: 9px;
        }
        html.tetris-game-active .mobile-summary-row > div:nth-child(2) .text-xl {
          font-size: 16px; line-height: 18px;
        }
        html.tetris-game-active .mobile-summary-row > div:nth-child(3) {
          width: 74px; min-width: 74px; height: 74px;
          padding: 4px; border-radius: 9px; overflow: hidden;
        }
        html.tetris-game-active #next-piece-panel {
          width: 56px; height: 50px; padding: 0; border: 0;
          border-radius: 7px; background: transparent;
          box-shadow: none; overflow: hidden;
        }
        html.tetris-game-active #next-piece-panel > div:first-child { display: none; }
        html.tetris-game-active #next-piece-panel > div:nth-child(2) {
          width: 56px; height: 50px; border-radius: 7px; overflow: hidden;
        }
        html.tetris-game-active #next-piece-panel canvas {
          width: 56px; height: auto; max-width: none;
        }
        html.tetris-game-active .mobile-board-wrap {
          width: 100%; flex: 1 1 auto; min-height: 0;
          display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        html.tetris-game-active #tetris-canvas {
          width: auto !important; height: 100% !important;
          max-width: calc(100vw - 12px) !important;
          max-height: 100% !important; aspect-ratio: 1 / 2;
        }
        html.tetris-game-active #mobile-touch-controls {
          width: 100%; max-width: none; flex: 0 0 auto;
          gap: 4px; margin-top: 4px;
          padding: 0 2px max(2px, env(safe-area-inset-bottom));
        }
        html.tetris-game-active #mobile-touch-controls > div { gap: 4px; }
        html.tetris-game-active #mobile-touch-controls button {
          height: 42px !important; border-radius: 9px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const root = document.documentElement;

        function syncVisibleHeight() {
          const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          root.style.setProperty('--tetris-visible-height', `${Math.round(height)}px`);
        }

        function enhanceMobileGameLayout() {
          const canvas = document.getElementById('tetris-canvas');
          root.classList.toggle('tetris-game-active', Boolean(canvas));
          if (!canvas) return;

          const hold = document.getElementById('hold-piece-panel');
          const summary = hold ? hold.parentElement : null;
          const boardWrap = canvas.parentElement && canvas.parentElement.parentElement;
          const layout = summary ? summary.parentElement : null;

          if (summary) summary.classList.add('mobile-summary-row');
          if (boardWrap) boardWrap.classList.add('mobile-board-wrap');
          if (layout) layout.classList.add('mobile-game-layout');
          syncVisibleHeight();
        }

        const observer = new MutationObserver(enhanceMobileGameLayout);
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
        window.addEventListener('resize', syncVisibleHeight, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(syncVisibleHeight, 250), { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncVisibleHeight, { passive: true });
        }
        syncVisibleHeight();
        enhanceMobileGameLayout();
      })();
    </script>
  </body>
